name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check data_collector tests
      - name: Mypy typecheck
        run: mypy data_collector
      - name: Pytest suite
        run: pytest tests --cov=data_collector --cov-report=term-missing
      - name: Bandit security scan
        run: bandit -r data_collector -ll
      - name: Pip audit
        run: pip-audit

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t data-collector:ci .
