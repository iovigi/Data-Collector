name: CI

on:
  push:
    branches: [main, "feat/**", "hardening/**"]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check data_collector tests
      - name: Mypy typecheck
        run: mypy data_collector
      - name: Pytest suite
        run: pytest tests --cov=data_collector --cov-report=term-missing
      - name: Bandit security scan
        run: bandit -r data_collector -ll
      - name: Pip audit
        run: pip-audit

  real-db-integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/
      MONGODB_DB: data_collector_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-integration-jwt-secret-key-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run real MongoDB + Redis smoke test
        run: |
          data-collector ensure-indexes
          pytest tests/integration -q

  docker-build:
    runs-on: ubuntu-latest
    needs: [quality-and-tests, real-db-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t data-collector:ci .
