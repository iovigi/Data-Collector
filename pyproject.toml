[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-collector"
version = "2.0.0rc1"
description = "Multi-tenant data collection platform with REST API v1, async jobs, and MCP integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.3,<4.0",
    "flask-cors>=6.0.0,<7.0",
    "flask-restx>=1.3.0,<2.0",
    "flask-jwt-extended>=4.6.0,<5.0",
    "pymongo>=4.10.0,<5.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "jsonschema>=4.23.0,<5.0",
    "argon2-cffi>=23.1.0,<26.0",
    "bcrypt>=4.2.0,<5.0",
    "PyJWT>=2.10.0,<3.0",
    "python-dotenv>=1.0.1,<2.0",
    "redis>=5.2.0,<6.0",
    "rq>=2.0.0,<3.0",
    "mcp>=1.2.0,<2.0",
    "httpx>=0.28.0,<1.0",
    "starlette>=1.3.1,<2.0",
    "uvicorn>=0.32.0,<1.0",
    "prometheus-client>=0.21.0,<1.0",
    "opentelemetry-api>=1.28.0,<2.0",
    "opentelemetry-sdk>=1.28.0,<2.0",
    "click>=8.1.7,<9.0",
    "gunicorn>=23.0.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "mongomock>=4.2.0",
    "fakeredis[lua]>=2.26.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
    # hosting/mcp_bridge.py (in-process MCP) and its tests import it on every platform.
    "a2wsgi>=1.10.0,<2.0",
]
# Windows IIS FastCGI hosting (docs/operations/IIS_DEPLOYMENT_REPORT.md)
iis = [
    "wfastcgi==3.0.0",
    "a2wsgi>=1.10.0,<2.0",
]

[project.scripts]
data-collector = "data_collector.cli:main"
dc-api = "data_collector.app:run_api"
dc-worker = "data_collector.workers.main:main"
dc-mcp-stdio = "data_collector.mcp.server_stdio:main"
dc-mcp-http = "data_collector.mcp.server_http:main"

[tool.setuptools.packages.find]
include = ["data_collector*", "api*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["data_collector", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["^api/", "^app\\.py$", "^setup\\.py$", "^venv/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --basetemp=.pytest_tmp"
