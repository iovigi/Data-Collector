services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    networks:
      - dc_internal
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks:
      - dc_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/var/storage
    volumes:
      - artifacts_data:/app/var/storage
    networks:
      - dc_internal
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp-http:
    build: .
    restart: unless-stopped
    command: ["dc-mcp-http"]
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/
      REDIS_URL: redis://redis:6379/0
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      STORAGE_DIR: /app/var/storage
    volumes:
      - artifacts_data:/app/var/storage
    networks:
      - dc_internal
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["dc-worker"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/var/storage
    volumes:
      - artifacts_data:/app/var/storage
    networks:
      - dc_internal
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATA_COLLECTOR_API_INTERNAL_URL: http://api:8000
      SESSION_REDIS_URL: redis://redis:6379/1
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-32-chars!!}
    networks:
      - dc_internal
    depends_on:
      - api
      - redis

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - dc_internal
    depends_on:
      - api
      - mcp-http
      - web

networks:
  dc_internal:
    driver: bridge

volumes:
  mongo_data:
  artifacts_data:
  caddy_data:
